<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1827" />
    <meta name="description" content="Explora el laberinto de las ideas. Una actividad de retroalimentación para CI-0115." />
    <title>Hipótesis Party · El laberinto de las ideas</title>
    <style>
      :root { color-scheme: dark; --navy: #0d1827; --cream: #f1ebdb; --teal: #48d4c0; --gold: #e0b76a; --muted: #95a8b4; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { display: grid; place-items: center; overflow: hidden; background: #080f1a; color: var(--cream); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .game-frame { position: relative; width: min(100vw, 160vh); width: min(100vw, 160dvh); aspect-ratio: 8 / 5; background: var(--navy); box-shadow: 0 20px 100px #0007; }
      canvas { display: block; width: 100% !important; height: 100% !important; outline: none; touch-action: none; }
      canvas:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
      .loading { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; overflow: hidden; padding: 6% 8%; background: var(--navy); }
      .loading[hidden] { display: none; }
      .orbits { position: absolute; width: 65%; aspect-ratio: 1; right: -14%; top: 5%; border: 1px solid #48d4c018; border-radius: 50%; pointer-events: none; }
      .orbits::before, .orbits::after { content: ""; position: absolute; border: 1px solid #48d4c01b; border-radius: 50%; }
      .orbits::before { inset: 9%; }
      .orbits::after { inset: 22%; }
      .brand { position: absolute; top: 7%; left: 8%; display: flex; align-items: center; gap: 20px; font-size: clamp(11px, 1.2vw, 18px); letter-spacing: .13em; font-weight: 700; }
      .brand-mark { color: var(--gold); font-size: 1.5em; }
      .copy { position: relative; max-width: 72%; }
      .eyebrow { color: var(--teal); font-size: clamp(9px, 1.3vw, 19px); font-weight: 650; letter-spacing: .14em; margin: 0 0 15px; }
      h1 { font-size: clamp(20px, 4.5vw, 66px); font-weight: 550; line-height: 1.07; letter-spacing: -.045em; margin: 0; }
      .subtitle { font-size: clamp(10px, 1.5vw, 22px); line-height: 1.5; color: var(--muted); margin: 22px 0 0; }
      .download { position: relative; width: 72%; margin-top: 8%; }
      .status-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
      #status { font-size: clamp(10px, 1.4vw, 20px); }
      #percentage { color: var(--gold); font-size: clamp(14px, 2.2vw, 32px); font-variant-numeric: tabular-nums; }
      progress { display: block; width: 100%; height: 8px; border: 0; border-radius: 100px; overflow: hidden; background: #243d4d; accent-color: var(--teal); }
      progress::-webkit-progress-bar { background: #243d4d; }
      progress::-webkit-progress-value { background: var(--teal); border-radius: 100px; }
      progress::-moz-progress-bar { background: var(--teal); border-radius: 100px; }
      progress[hidden] { display: none; }
      .footnote { position: absolute; left: 8%; bottom: 7%; font-size: clamp(8px, 1.1vw, 16px); color: var(--muted); letter-spacing: .06em; }
      #error-detail { max-height: 5em; overflow: auto; color: #f57f79; font-size: clamp(10px, 1.2vw, 18px); line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
      #retry { margin-top: 18px; padding: 12px 22px; border: 0; border-radius: 9px; background: var(--teal); color: var(--navy); font: inherit; font-weight: 650; cursor: pointer; }
      #retry:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
      #retry[hidden], #error-detail[hidden] { display: none; }
      noscript { position: absolute; inset: 12%; display: grid; place-items: center; background: var(--navy); color: var(--cream); padding: 2rem; text-align: center; }
      @media (max-height: 500px) { .subtitle { margin-top: 10px; } .download { margin-top: 5%; } .eyebrow { margin-bottom: 8px; } .status-line { margin-bottom: 8px; } }
    </style>
  </head>
  <body>
    <main class="game-frame" aria-label="Hipótesis Party">
      <canvas id="canvas" width="1440" height="900" tabindex="0" aria-label="Juego Hipótesis Party. Usa Enter para comenzar, las flechas o WASD para caminar, H para pedir una ruta y Escape para pausar."></canvas>
      <section id="loading" class="loading" aria-labelledby="loading-title" aria-busy="true">
        <div class="orbits" aria-hidden="true"></div>
        <div class="brand"><span class="brand-mark">H / P</span><span>HIPÓTESIS PARTY</span></div>
        <div class="copy">
          <p class="eyebrow">APRENDE. EXPLORA. COMPARTE.</p>
          <h1 id="loading-title">Cada pregunta<br />abre un camino.</h1>
          <p class="subtitle">Estamos preparando tu visita<br />al laberinto de las ideas.</p>
        </div>
        <div class="download">
          <div class="status-line"><span id="status" role="status" aria-live="polite">Preparando la descarga…</span><span id="percentage" aria-hidden="true">—</span></div>
          <progress id="progress" max="100" aria-label="Descarga del juego"></progress>
          <p id="error-detail" hidden></p>
          <button id="retry" type="button" hidden>Volver a intentar</button>
        </div>
        <div class="footnote">CI-0115 &nbsp; / &nbsp; EL LABERINTO DE LAS IDEAS</div>
      </section>
      <noscript>Este juego necesita JavaScript y WebGL. Activa JavaScript y vuelve a cargar la página.</noscript>
    </main>
    <script>
      var Module = (() => {
        const canvas = document.getElementById('canvas');
        const overlay = document.getElementById('loading');
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const percentage = document.getElementById('percentage');
        const retry = document.getElementById('retry');
        let ready = false;
        let failed = false;
        let lastPercent = -1;

        function showError(reason) {
          if (failed) return;
          failed = true;
          overlay.hidden = false;
          overlay.setAttribute('aria-busy', 'false');
          document.getElementById('loading-title').textContent = 'El campus no pudo abrirse.';
          document.querySelector('.subtitle').textContent = 'Vuelve a cargar la página para intentarlo otra vez.';
          status.setAttribute('role', 'alert');
          status.textContent = 'No se pudo iniciar el juego. Puedes volver a intentarlo.';
          progress.hidden = true;
          percentage.textContent = '';
          const detail = document.getElementById('error-detail');
          detail.textContent = String(reason || 'Comprueba la conexión y que el navegador admita WebGL.').slice(0, 700);
          detail.hidden = false;
          retry.hidden = false;
          retry.focus();
        }

        retry.addEventListener('click', () => window.location.reload());
        canvas.addEventListener('pointerdown', () => canvas.focus());
        canvas.addEventListener('contextmenu', event => event.preventDefault());
        canvas.addEventListener('webglcontextlost', event => {
          event.preventDefault();
          showError('Se perdió el contexto gráfico. Vuelve a cargar la página para restaurar el campus.');
        });
        window.addEventListener('error', event => {
          if (event.target instanceof HTMLScriptElement) showError('No se pudo descargar el programa del juego.');
        }, true);
        window.addEventListener('unhandledrejection', event => {
          if (!ready) showError(event.reason);
        });

        return {
          canvas,
          print: (...args) => console.log(...args),
          printErr: (...args) => console.error(...args),
          setStatus(message) {
            if (ready || failed) return;
            const text = String(message || '');
            const match = text.match(/\(([\d.]+)\s*\/\s*([\d.]+)\)/);
            if (match && /download/i.test(text)) {
              const loaded = Number(match[1]);
              const total = Number(match[2]);
              if (total > 0 && Number.isFinite(loaded) && Number.isFinite(total)) {
                const value = Math.max(0, Math.min(100, loaded / total * 100));
                progress.value = value;
                const rounded = Math.floor(value);
                percentage.textContent = rounded + '%';
                // Announce real changes in whole percentages, not every byte chunk.
                if (rounded !== lastPercent) {
                  status.textContent = 'Descargando el campus · ' + rounded + '%';
                  lastPercent = rounded;
                }
                return;
              }
            }
            progress.removeAttribute('value');
            percentage.textContent = '—';
            status.textContent = /download/i.test(text) ? 'Descargando el campus…' : 'Preparando el juego…';
          },
          onRuntimeInitialized() {
            if (failed) return;
            ready = true;
            progress.value = 100;
            overlay.setAttribute('aria-busy', 'false');
            overlay.hidden = true;
            canvas.focus();
          },
          onAbort: showError
        };
      })();
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
